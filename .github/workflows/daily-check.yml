# รัน check ทุกเช้าวันทำการ 08:00 น. เวลาไทย (= 01:00 UTC)
# ต้องตั้ง secret DISCORD_WEBHOOK_URL และ WATCH_CONFIG_JSON (เนื้อหา watch.config.json ทั้งไฟล์)
# ถ้าไม่ตั้ง WATCH_CONFIG_JSON จะใช้ watch.config.example.json แทน
# หมายเหตุ: cron ของ GitHub Actions อาจคลาดได้หลายนาที ไม่เหมาะกับการเช็คสถานะแบบเรียลไทม์
name: Daily schedule check
on:
  schedule:
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
concurrency: daily-check
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # เก็บ state ข้ามรอบด้วย cache จะได้ไม่แจ้งซ้ำทุกวัน
      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: notified-state-${{ github.run_id }}
          restore-keys: notified-state-
      - name: เตรียม watch.config.json จาก secret (หรือใช้ตัวอย่าง)
        run: |
          if [ -n "$WATCH_CONFIG_JSON" ]; then printf '%s' "$WATCH_CONFIG_JSON" > watch.config.json
          else cp watch.config.example.json watch.config.json; fi
        env:
          WATCH_CONFIG_JSON: ${{ secrets.WATCH_CONFIG_JSON }}
      - run: npx tsx src/cli.ts check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .state
          key: notified-state-${{ github.run_id }}
